name: mpv clang
defaults:
  run:
    shell: bash

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: write

env:
  # cache namespace; bump to invalidate every stale cache at once
  CACHE_VERSION: v4

jobs:
  build_mpv:
    name: Building mpv
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bit: [x86_64]
    env:
      BIT: ${{ matrix.bit }}
    container:
      image: docker://ghcr.io/shinchiro/archlinux:latest
    steps:
      - name: Init variable
        run: |
          if [[ $BIT == "i686" ]]; then
            echo "arch=i686" >> $GITHUB_ENV
          elif [[ $BIT == "x86_64" ]]; then
            echo "arch=x86_64" >> $GITHUB_ENV
          elif [[ $BIT == "x86_64_v3" ]]; then
            echo "arch=x86_64" >> $GITHUB_ENV
            echo "x86_64_level=-v3" >> $GITHUB_ENV
            echo "x86_64_v3_ARCH=-DGCC_ARCH=x86-64-v3" >> $GITHUB_ENV
          elif [[ $BIT == "aarch64" ]]; then
            echo "arch=aarch64" >> $GITHUB_ENV
          fi

      - name: Build version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "version=develop" >> $GITHUB_ENV
          fi

      - name: Setup git config
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config --global fetch.prune true
          git config --global --add safe.directory $PWD

      - uses: actions/checkout@main

      - name: Loading clang sysroot cache
        uses: actions/cache/restore@main
        with:
          path: clang_root
          key: ${{ env.CACHE_VERSION }}-clang_root-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-clang_root

      - name: Loading repository cache
        uses: actions/cache/restore@main
        with:
          path: src_packages
          key: ${{ env.CACHE_VERSION }}-repository-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-repository

      - name: Loading ${{ matrix.bit }} toolchain cache
        uses: actions/cache/restore@main
        with:
          path: |
            build_${{ matrix.bit }}
          key: ${{ env.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain

      - name: Repair cached sources
        run: |
          # An interrupted clone that gets saved into the repository cache
          # leaves a source tree without .git. git then silently walks up to
          # the build repository, so force-update refs and reset targets are
          # resolved in the wrong repo and the package never builds again.
          # Drop such trees together with their package prefix so the
          # download step clones them from scratch.
          if [ -d src_packages ]; then
            for dir in src_packages/*/; do
              name=$(basename "$dir")
              # empty dirs are ExternalProject placeholders, not clones
              if [ -n "$(ls -A "$dir")" ] && [ ! -e "$dir/.git" ]; then
                echo "dropping incomplete source cache: $name"
                rm -rf "$dir" \
                       "build_$BIT/packages/$name-prefix" \
                       "build_$BIT/toolchain/$name-prefix"
              fi
            done
          fi
          # A cache saved mid-checkout can leave a sparse tree without the
          # files the build needs (llvm lost compiler-rt/lib/builtins), while
          # the download stamp still suppresses a re-clone. Reapply the
          # sparse patterns; if the tree is still incomplete, rebuild llvm.
          if [ -d src_packages/llvm/.git ]; then
            git -C src_packages/llvm sparse-checkout reapply || true
            if [ ! -d src_packages/llvm/compiler-rt/lib/builtins ]; then
              echo "llvm source is incomplete, dropping it for a re-clone"
              rm -rf src_packages/llvm build_$BIT/toolchain/llvm-prefix \
                     build_$BIT/toolchain/llvm-wrapper-prefix \
                     build_$BIT/toolchain/llvm-compiler-rt-builtin-prefix \
                     build_$BIT/toolchain/llvm-libcxx-prefix \
                     build_$BIT/toolchain/llvm-compiler-rt-prefix \
                     build_$BIT/toolchain/llvm-openmp-prefix
            fi
          fi

      - name: Normalize restored stamps
        run: |
          # actions/cache does not keep the relative mtimes of ExternalProject
          # stamp files, so a restored tree can look like "download is newer
          # than configure". That cascades into rebuilding the whole toolchain
          # (mingw headers, crt, libcxx) on a warm cache. Touch the stamps in
          # step order to restore the dependency ordering; force-update still
          # deletes stamps, so real invalidation keeps working.
          for step in mkdir download update check-git write-head patch autoreconf force-meson-configure configure build install postremovebuild done; do
            find build_$BIT -type f -path "*-stamp/*" -name "*-$step" -exec touch {} + 2>/dev/null || true
          done

      - name: Configuring CMake & Downloading source
        run: |
          cmake -DTARGET_ARCH=${{ env.arch }}-w64-mingw32 -DCOMPILER_TOOLCHAIN=clang ${{ env.x86_64_v3_ARCH }} -DBUILD_VERSION=${{ env.version }} -DCMAKE_INSTALL_PREFIX=$PWD/clang_root -DMINGW_INSTALL_PREFIX=$PWD/build_$BIT/$BIT-w64-mingw32 -DSINGLE_SOURCE_LOCATION=$PWD/src_packages -DRUSTUP_LOCATION=$PWD/clang_root/install_rustup -DENABLE_CCACHE=ON -DCLANG_PACKAGES_LTO=ON -G Ninja --fresh -B build_$BIT -S $PWD
          ninja -C build_$BIT download || true

      - name: Building toolchain
        run: |
          # The toolchain is a unit: clang in clang_root plus the MinGW runtime,
          # winpthreads and libc++ in the sysroot. When it is already installed,
          # do not touch the build tree at all - restored mtimes make ninja want
          # to re-run toolchain steps, and a reconfigure of a restored
          # llvm-libcxx build dir (out-of-source, never cleaned) inherits a stale
          # CMake cache that breaks the header search path.
          sysroot=build_$BIT/$BIT-w64-mingw32
          if [ -x clang_root/bin/clang ] \
             && [ -x clang_root/bin/${arch}-w64-mingw32-ar ] \
             && [ -f "$sysroot/lib/libmingwex.a" ] \
             && [ -f "$sysroot/lib/libwinpthread.a" ] \
             && [ -f "$sysroot/lib/libc++.a" ] \
             && [ -f "$sysroot/include/c++/v1/vector" ] \
             && ls clang_root/lib/clang/*/lib/*/libcompiler_rt.a >/dev/null 2>&1; then
            echo "toolchain is complete in clang_root + $sysroot; skipping"
            exit 0
          fi
          # Rebuild every toolchain package from a clean build tree, keeping the
          # llvm source and an already installed clang.
          rm -rf build_$BIT/toolchain
          if [ ! -x clang_root/bin/clang ]; then
            ninja -C build_$BIT llvm
          fi
          if [ ! -f src_packages/llvm/compiler-rt/lib/builtins/CMakeLists.txt ]; then
            ninja -C build_$BIT llvm-download
          fi
          ninja -C build_$BIT llvm-clang

      - name: Building mpv
        run: |
          ninja -C build_$BIT update || true
          ninja -C build_$BIT mpv

      - name: Packaging mpv
        run: |
          mkdir -p release_$BIT
          ninja -C build_$BIT mpv-packaging; mv build_$BIT/mpv*.zip release_$BIT

      - name: Collecting logs
        if: always()
        run: |
          mkdir -p build_${BIT}_logs
          cp -fr $(find build_$BIT -type f -iname "*-*.log" -or -wholename "*/ffbuild/config.log") build_${BIT}_logs || true
          7z a -m0=lzma2 -mx=9 -ms=on logs.7z build*logs

      - name: Uploading logs
        uses: actions/upload-artifact@master
        if: always()
        with:
          name: mpv-${{ matrix.bit }}-logs
          path: logs.7z
          retention-days: 1

      - name: Uploading ${{ matrix.bit }} build
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ matrix.bit }}
          path: release_${{ matrix.bit }}/mpv-${{ env.arch }}*

      - name: Uploading ${{ matrix.bit }} dev
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ matrix.bit }}-dev
          path: release_${{ matrix.bit }}/mpv-dev-${{ env.arch }}*

      - name: Uploading ${{ matrix.bit }} debug
        uses: actions/upload-artifact@master
        with:
          name: mpv-${{ matrix.bit }}-debug
          path: release_${{ matrix.bit }}/mpv-debug-${{ env.arch }}*

      - name: Cleaning build directory
        if: always()
        run: |
          rm -rf build_$BIT/mpv*
          rm -rf release_$BIT/mpv-debug*.zip

      - name: Saving clang sysroot cache
        uses: actions/cache/save@main
        if: ${{ always() && matrix.bit == 'x86_64' }}
        with:
          path: clang_root
          key: ${{ env.CACHE_VERSION }}-clang_root-${{ github.run_id }}

      - name: Saving repository cache
        uses: actions/cache/save@main
        if: ${{ always() && matrix.bit == 'x86_64' }}
        with:
          path: src_packages
          key: ${{ env.CACHE_VERSION }}-repository-${{ github.run_id }}

      - name: Saving ${{ matrix.bit }} toolchain cache
        uses: actions/cache/save@main
        if: always()
        with:
          path: |
            build_${{ matrix.bit }}
          key: ${{ env.CACHE_VERSION }}-clang-${{ matrix.bit }}_toolchain-${{ github.run_id }}

      - name: Saving release_${{ matrix.bit }} cache
        uses: actions/cache/save@main
        if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
        with:
          path: release_${{ matrix.bit }}
          key: ${{ env.CACHE_VERSION }}-release_${{ matrix.bit }}-${{ github.run_id }}

  release:
    name: Upload releases
    runs-on: ubuntu-latest
    needs: build_mpv
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    container:
      image: docker://alpine:latest

    steps:
      - name: Installing dependencies
        shell: sh
        run: |
          apk add --update --no-cache bash curl

      - name: Loading release_i686 cache
        uses: actions/cache/restore@main
        with:
          path: release_i686
          key: ${{ env.CACHE_VERSION }}-release_i686-${{ github.run_id }}

      - name: Loading release_x86_64 cache
        uses: actions/cache/restore@main
        with:
          path: release_x86_64
          key: ${{ env.CACHE_VERSION }}-release_x86_64-${{ github.run_id }}

      - name: Loading release_x86_64_v3 cache
        uses: actions/cache/restore@main
        with:
          path: release_x86_64_v3
          key: ${{ env.CACHE_VERSION }}-release_x86_64_v3-${{ github.run_id }}

      - name: Loading release_aarch64 cache
        uses: actions/cache/restore@main
        with:
          path: release_aarch64
          key: ${{ env.CACHE_VERSION }}-release_aarch64-${{ github.run_id }}

      - name: Moving archives
        run: |
          mkdir -p release
          mv release_i686/* release_x86_64/* release_x86_64_v3/* release_aarch64/* release
          du -ah release/*

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          body: |
            **Workflow run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            release/*.zip
